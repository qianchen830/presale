<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Modal</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.0/dist/vue.global.prod.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #fff; font-family: sans-serif; }

.dt-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.dt-modal, .dt-modal-box {
  width: 100%; max-height: 88vh;
  background: rgba(12,12,32,0.97);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px 24px 0 0;
  display: flex; flex-direction: column;
}
.dt-modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.dt-modal-title { font-size: 17px; font-weight: 800; }
.dt-modal-close { font-size: 20px; cursor: pointer; padding: 4px 8px; }
.dt-modal-bd {
  padding: 14px 16px; overflow-y: auto; flex: 1; min-height: 0;
}
.dt-modal-ft {
  padding: 10px 16px; display: flex; gap: 8px; flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.dt-btn { padding: 10px 18px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.dt-btn-primary { background: linear-gradient(135deg,#667EEA,#764BA2); color: #fff; }
.dt-btn-default { background: rgba(255,255,255,0.1); color: #fff; }

.profile-info-section {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px; overflow: hidden; margin-bottom: 12px;
}
.profile-info-row {
  display: flex; padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.profile-info-row:last-child { border-bottom: none; }
.profile-info-lbl { width: 70px; font-size: 13px; font-weight: 600; color: #aaa; flex-shrink: 0; }
.profile-info-val { flex: 1; font-size: 14px; font-weight: 600; color: #fff; word-break: break-all; }

.profile-pwd-area {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px; padding: 16px;
}
.profile-pwd-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 14px; }
.profile-pwd-row { margin-bottom: 12px; }
.dt-form-label { font-size: 12px; font-weight: 700; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.pwd-input-wrap { position: relative; }
.pwd-input-wrap .dt-input { width: 100%; padding: 12px 44px 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; box-sizing: border-box; }
.pwd-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; cursor: pointer; }
.dt-btn-full { width: 100%; margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <button @click="openModal('selfProfile','view',{})" style="padding:20px;font-size:20px">打开密码弹窗</button>

  <div v-if="modal" class="dt-modal-overlay" @click.self="closeModal">
    <div class="dt-modal" @click.stop>
      <div class="dt-modal-hd">
        <div class="dt-modal-title">个人信息</div>
        <div class="dt-modal-close" @click="closeModal">✕</div>
      </div>
      <div class="dt-modal-bd">
        <template v-if="modal.name === 'selfProfile'">
          <div class="profile-info-section">
            <div class="profile-info-row"><div class="profile-info-lbl">用户名</div><div class="profile-info-val">admin</div></div>
            <div class="profile-info-row"><div class="profile-info-lbl">角色</div><div class="profile-info-val">管理员</div></div>
            <div class="profile-info-row"><div class="profile-info-lbl">部门</div><div class="profile-info-val">销售部</div></div>
          </div>
          <div class="profile-pwd-area">
            <div class="profile-pwd-title">🔑 修改密码</div>
            <div class="profile-pwd-row">
              <div class="dt-form-label">旧密码</div>
              <div class="pwd-input-wrap">
                <input :type="showOldPwd ? 'text' : 'password'" class="dt-input" v-model="oldPwd" placeholder="请输入旧密码" />
                <span class="pwd-eye" @click="showOldPwd = !showOldPwd">{{ showOldPwd ? '🙈' : '👁️' }}</span>
              </div>
            </div>
            <div class="profile-pwd-row">
              <div class="dt-form-label">新密码</div>
              <div class="pwd-input-wrap">
                <input :type="showNewPwd ? 'text' : 'password'" class="dt-input" v-model="newPwd" placeholder="至少6位" />
                <span class="pwd-eye" @click="showNewPwd = !showNewPwd">{{ showNewPwd ? '🙈' : '👁️' }}</span>
              </div>
            </div>
            <div class="profile-pwd-row">
              <div class="dt-form-label">确认新密码</div>
              <div class="pwd-input-wrap">
                <input :type="showConfirmPwd ? 'text' : 'password'" class="dt-input" v-model="confirmPwd" placeholder="再输入一次" />
                <span class="pwd-eye" @click="showConfirmPwd = !showConfirmPwd">{{ showConfirmPwd ? '🙈' : '👁️' }}</span>
              </div>
            </div>
            <button class="dt-btn dt-btn-primary dt-btn-full" @click="doChangePassword">{{ pwdLoading ? '修改中…' : '确认修改密码' }}</button>
          </div>
        </template>
      </div>
      <div class="dt-modal-ft">
        <button class="dt-btn dt-btn-default" @click="closeModal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive } = Vue;
createApp({
  setup() {
    const modal = ref(null);
    const oldPwd = ref('');
    const newPwd = ref('');
    const confirmPwd = ref('');
    const showOldPwd = ref(false);
    const showNewPwd = ref(false);
    const showConfirmPwd = ref(false);
    const pwdLoading = ref(false);

    function openModal(name, mode, data) {
      modal.value = { name, mode, data };
      oldPwd.value = ''; newPwd.value = ''; confirmPwd.value = '';
    }
    function closeModal() { modal.value = null; }
    function doChangePassword() {
      if (!oldPwd.value) { alert('请输入旧密码'); return; }
      if (!newPwd.value) { alert('请输入新密码'); return; }
      if (newPwd.value.length < 6) { alert('新密码至少6位'); return; }
      if (newPwd.value !== confirmPwd.value) { alert('两次新密码不一致'); return; }
      pwdLoading.value = true;
      setTimeout(() => { pwdLoading.value = false; alert('密码修改成功！'); }, 1000);
    }
    return { modal, oldPwd, newPwd, confirmPwd, showOldPwd, showNewPwd, showConfirmPwd, pwdLoading, openModal, closeModal, doChangePassword };
  }
}).mount('#app');
</script>
</body>
</html>
